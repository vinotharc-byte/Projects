<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planner Pro Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              planner: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                600: '#0d9488', // Teal-ish like Planner
                700: '#0f766e',
              },
              ms: {
                gray: '#f3f2f1', // Microsoft background gray
                offwhite: '#faf9f8'
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-app: #faf9f8;
        --bg-surface: #ffffff;
        --border-color: #e2e8f0;
        --text-primary: #111827;
        --text-secondary: #6b7280;
      }

      .dark {
        --bg-app: #111111;
        --bg-surface: #1e1e1e;
        --border-color: #333333;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
      }

      body {
        font-family: 'Segoe UI', 'Segoe UI Web (West European)', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
        background-color: var(--bg-app);
        color: var(--text-primary);
        transition: background-color 0.2s, color 0.2s;
      }
      
      /* Dark mode overrides for specific elements if needed */
      .dark body {
        background-color: var(--bg-app);
      }

      /* Custom scrollbar for horizontal buckets */
      .horizontal-scroll::-webkit-scrollbar {
        height: 8px;
      }
      .horizontal-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .horizontal-scroll::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
      }
      .dark .horizontal-scroll::-webkit-scrollbar-thumb {
        background-color: #4b5563;
      }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
